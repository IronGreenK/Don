<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>El Don — prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --humo:#0D0A08; --papel:#1C1512; --papel2:#241B16;
  --llama:#E8A33D; --llama2:#F5C56B;
  --sangre:#8C2F2F; --anima:#6E8FA3; --hueso:#D9CBB3; --hueso2:#8A7D66;
  --verde:#5E7350;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--humo); color:var(--hueso);
  font-family:'Crimson Text',serif; font-size:17px;
  display:flex;flex-direction:column;align-items:center;
  user-select:none;-webkit-user-select:none;
}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ---------- cabecera ---------- */
header{padding:14px 18px 8px;text-align:center}
#nombre{font-family:'IM Fell English',serif;font-size:1.35rem;letter-spacing:.5px;color:var(--llama2)}
#grado{font-style:italic;color:var(--hueso2);font-size:.95rem}
#gen{font-size:.8rem;color:var(--hueso2);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

/* ---------- stats ---------- */
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:10px 22px 4px}
.stat{font-size:.85rem}
.stat .lbl{display:flex;justify-content:space-between;color:var(--hueso2);letter-spacing:1px}
.stat .lbl b{color:var(--hueso);font-weight:600}
.barra{height:4px;background:#000;border-radius:2px;margin-top:3px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:2px;transition:width .5s ease}
#b-don i{background:var(--llama)} #b-temor i{background:var(--sangre)}
#b-alma i{background:var(--anima)} #b-plata i{background:var(--verde)}

/* ---------- escena vela ---------- */
#escena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
#vela{cursor:pointer;text-align:center;transition:transform .08s}
#vela:active{transform:scale(.96)}
.flama{
  width:26px;height:60px;margin:0 auto;position:relative;
  background:radial-gradient(ellipse at 50% 80%, #fff 0%, var(--llama2) 25%, var(--llama) 55%, transparent 75%);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  filter:blur(.5px);
  animation:titilar 2.4s ease-in-out infinite;
  transform-origin:50% 100%;
}
@keyframes titilar{
  0%,100%{transform:scaleY(1) skewX(0deg)}
  20%{transform:scaleY(1.08) skewX(2deg)}
  45%{transform:scaleY(.94) skewX(-3deg)}
  70%{transform:scaleY(1.05) skewX(1.5deg)}
}
.halo{position:absolute;left:50%;top:30px;transform:translate(-50%,-50%);
  width:220px;height:220px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(232,163,61,.14) 0%, transparent 65%);
  animation:respirar 4s ease-in-out infinite}
@keyframes respirar{0%,100%{opacity:.8}50%{opacity:1.15}}
.cuerpo-vela{width:34px;height:74px;margin:-6px auto 0;background:linear-gradient(180deg,#E9DFC8,#B8A98A 70%,#7d7159);border-radius:6px 6px 3px 3px;position:relative}
.cuerpo-vela::before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:3px;height:8px;background:#3a2f24}
#pie-vela{margin-top:14px;font-style:italic;color:var(--hueso2);font-size:.9rem;min-height:1.4em}
.mas-uno{position:absolute;color:var(--llama2);font-family:'IM Fell English',serif;pointer-events:none;animation:subir 1s ease-out forwards;font-size:1.1rem}
@keyframes subir{to{transform:translateY(-70px);opacity:0}}

/* ---------- acciones ---------- */
#acciones{padding:0 22px 26px;display:flex;flex-direction:column;gap:10px}
button.acc{
  font-family:'IM Fell English',serif;font-size:1.05rem;color:var(--hueso);
  background:var(--papel);border:1px solid #3a2e24;border-radius:8px;
  padding:13px;cursor:pointer;letter-spacing:.5px;transition:background .2s;
  opacity:0;animation:aparecer .8s ease forwards;
}
button.acc:active{background:var(--papel2)}
button.acc.dorado{border-color:var(--llama);color:var(--llama2)}
@keyframes aparecer{to{opacity:1}}
button.acc small{display:block;font-family:'Crimson Text',serif;font-style:italic;color:var(--hueso2);font-size:.8rem;letter-spacing:0}

/* ---------- carta ---------- */
#velo{position:absolute;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(2px)}
#velo.abierto{display:flex}
#carta{
  width:86%;max-width:340px;background:linear-gradient(160deg,var(--papel2),var(--papel));
  border:1px solid #45362a;border-radius:12px;padding:26px 22px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.8), inset 0 0 40px rgba(0,0,0,.4);
  animation:entrar .35s ease;position:relative;
}
@keyframes entrar{from{transform:translateY(30px) rotate(1.5deg);opacity:0}}
#carta .tipo{font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--hueso2);text-align:center;margin-bottom:12px}
#carta .texto{font-size:1.06rem;line-height:1.55;text-align:center;font-style:italic;min-height:80px}
#carta .edad-nota{text-align:center;color:var(--hueso2);font-size:.8rem;margin-top:12px}
#opciones{display:flex;gap:10px;margin-top:20px}
#opciones button{
  flex:1;font-family:'Crimson Text',serif;font-size:.95rem;padding:12px 8px;
  background:transparent;border:1px solid #4a3b2e;border-radius:8px;color:var(--hueso);cursor:pointer
}
#opciones button:active{background:#2a2019}
#opciones button .flecha{display:block;font-family:'IM Fell English',serif;color:var(--llama);margin-bottom:3px}
#resultado{margin-top:16px;text-align:center;font-size:.92rem;color:var(--llama2);min-height:1.3em;display:none}

/* ---------- prueba ---------- */
.prob{font-family:'IM Fell English',serif;font-size:2.2rem;text-align:center;color:var(--llama2);margin:10px 0 4px}

/* ---------- muerte ---------- */
#muerte{position:absolute;inset:0;background:var(--humo);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20}
#muerte.abierto{display:flex}
#muerte h2{font-family:'IM Fell English',serif;font-size:1.8rem;color:var(--sangre);margin-bottom:14px}
#muerte p{font-style:italic;color:var(--hueso2);line-height:1.6;max-width:300px}
#herencia{margin:22px 0;padding:16px 22px;border:1px solid #3a2e24;border-radius:10px;background:var(--papel)}
#herencia .h-lbl{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--hueso2)}
#herencia .h-val{font-family:'IM Fell English',serif;font-size:1.5rem;color:var(--llama2)}

/* ---------- toast pasivo ---------- */
#pactos-info{position:absolute;top:8px;right:12px;font-size:.72rem;color:var(--hueso2);font-style:italic}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="gen">Primera generación</div>
    <div id="nombre">El que mira la vela</div>
    <div id="grado">Curioso · 16 años</div>
  </header>

  <div id="stats">
    <div class="stat"><div class="lbl"><span>DON</span><b id="v-don">0</b></div><div class="barra" id="b-don"><i style="width:0%"></i></div></div>
    <div class="stat"><div class="lbl"><span>TEMOR</span><b id="v-temor">0</b></div><div class="barra" id="b-temor"><i style="width:0%"></i></div></div>
    <div class="stat"><div class="lbl"><span>ALMA</span><b id="v-alma">100</b></div><div class="barra" id="b-alma"><i style="width:100%"></i></div></div>
    <div class="stat"><div class="lbl"><span>PLATA</span><b id="v-plata">0</b></div><div class="barra" id="b-plata"><i style="width:0%"></i></div></div>
  </div>

  <div id="escena">
    <div id="pactos-info"></div>
    <div id="vela">
      <div class="halo"></div>
      <div class="flama"></div>
      <div class="cuerpo-vela"></div>
    </div>
    <div id="pie-vela">La vela arde. Algo en la llama te devuelve la mirada.</div>
  </div>

  <div id="acciones"></div>

  <div id="velo"><div id="carta">
    <div class="tipo" id="c-tipo">EN EL MONTE</div>
    <div class="texto" id="c-texto"></div>
    <div class="prob" id="c-prob" style="display:none"></div>
    <div id="opciones"></div>
    <div id="resultado"></div>
    <div class="edad-nota" id="c-edad"></div>
  </div></div>

  <div id="muerte">
    <h2 id="m-titulo"></h2>
    <p id="m-texto"></p>
    <div id="herencia">
      <div class="h-lbl">Tu aprendiz hereda</div>
      <div class="h-val" id="h-don">0 de Don</div>
    </div>
    <button class="acc dorado" style="opacity:1;width:100%" onclick="renacer()">Encender la vela de nuevo</button>
  </div>
</div>

<script>
/* ================= ESTADO ================= */
const GRADOS=[
 {n:"Curioso",   req:0,   prob:1},
 {n:"Aprendiz",  req:60,  prob:.64, prueba:"Debes pasar la noche entera en el cementerio sin nombrar a Dios."},
 {n:"Iniciado",  req:250, prob:.55, prueba:"Debes lavarte doce noches en la cascada hasta que el agua borre el bautismo."},
 {n:"Compadre",  req:800, prob:.45, prueba:"Debes entrar a la cueva y salir con lo que te entreguen, sin mirar atrás."},
];
let S=null, ultimaGanancia=0, tortaTimer=null;

function nuevoEstado(don0,gen,bonus){
  return {don:don0,temor:0,alma:100,plata:10,edad:16,grado:0,gen:gen,bonus:bonus,
          pactos:0,muerto:false,cartasVistas:[],toques:0,monteAbierto:false};
}
function iniciar(){ S=nuevoEstado(0,1,0); pintar(); }

/* ================= VELA ================= */
const vela=document.getElementById('vela');
vela.addEventListener('pointerdown',e=>{
  if(S.muerto)return;
  S.toques++; ganarDon(1+S.bonus);
  const m=document.createElement('div');m.className='mas-uno';m.textContent='+'+(1+S.bonus);
  m.style.left=(e.clientX-10)+'px';m.style.top=(e.clientY-30)+'px';
  document.getElementById('app').appendChild(m);setTimeout(()=>m.remove(),1000);
  if(S.toques===18&&!S.monteAbierto){S.monteAbierto=true;
    setPie("Algo se mueve entre los árboles, allá afuera.");pintarAcciones();}
});
function ganarDon(n){S.don+=n;ultimaGanancia=n;pintar();}
function setPie(t){document.getElementById('pie-vela').textContent=t;}

/* Don pasivo por pactos */
setInterval(()=>{if(S&&!S.muerto&&S.pactos>0){S.don+=S.pactos;pintar(true);}},1000);

/* ================= CARTAS ================= */
const CARTAS=[
 {t:"Una mujer llora en el vado del río. Tiene la espalda vuelta. Sabes lo que es.",
  a:{l:"Seguir de largo",fx:{}},b:{l:"Escuchar qué pide",fx:{alma:-10,pacto:1},r:"Te habla sin voz. Desde hoy, algo trabaja para ti mientras duermes."}},
 {t:"El perro negro aparece en el camino por tercera noche. No ladra. Espera.",
  a:{l:"Tirarle una piedra",fx:{temor:5},r:"El pueblo murmura que le pegaste a lo que no se le pega."},
  b:{l:"Dejarle pan",fx:{don:8,alma:-3},r:"Lo come sin masticar. Te sientes más liviano y más extraño."}},
 {t:"La vieja del cerro ofrece enseñarte un remedio. A cambio quiere un mechón de tu pelo.",
  a:{l:"Negarte",fx:{},r:"Te mira largo. 'Volverás', dice."},
  b:{l:"Dárselo",fx:{don:15,temor:8},r:"Aprendes el remedio. Esa noche sueñas con tijeras."}},
 {t:"Un enfermo te manda a buscar. El doctor ya lo desahució. La familia junta plata.",
  a:{l:"No meterte",fx:{alma:5},r:"Duermes tranquilo. El velorio es el jueves."},
  b:{l:"Intentar la cura",fx:{plata:25,temor:10,don:5},r:"Sana. Te pagan callados y no te miran a los ojos."}},
 {t:"Encuentras un entierro: monedas viejas bajo un espino. Dicen que la plata enterrada tiene dueño abajo.",
  a:{l:"Taparlo de nuevo",fx:{alma:4},r:"Mejor deberle a los vivos que a los otros."},
  b:{l:"Sacarlo",fx:{plata:40,temor:6,alma:-6},r:"La plata pesa más de lo que debería."}},
 {t:"En la cantina, uno te desafía: doble o nada al cacho, tu plata contra la suya. Ríe fuerte. Trae un anillo que no es de acá.",
  apuesta:true},
 {t:"El cura llega a tu puerta. 'Sé lo que andas haciendo en el monte', dice.",
  a:{l:"Negarlo todo",fx:{temor:-8},r:"Te persignas. Él duda. Ganas tiempo."},
  b:{l:"Sostenerle la mirada",fx:{temor:12,don:6},r:"Se va sin bendecirte. El pueblo entero lo nota."}},
 {t:"Una lechuza se para en tu techo tres noches seguidas. La vecina dice que alguien te está velando.",
  a:{l:"Ignorarla",fx:{},r:"La cuarta noche no vuelve. O no la oyes."},
  b:{l:"Responderle en su lengua",fx:{don:12,temor:5},r:"Contesta. Ahora sabes quién pregunta por ti."}},
 {t:"Un arriero perdido te ofrece su mula si le muestras el camino. Hay niebla. Tú ves en la niebla.",
  a:{l:"Cobrarle en plata",fx:{plata:15},r:"Paga y se va rápido, sin dar las gracias."},
  b:{l:"Cobrarle un secreto",fx:{don:10},r:"Te cuenta dónde duerme el que no debe ser nombrado."}},
 {t:"Tu compadre enferma de repente. Sabes reconocer un mal echado. Y sabes quién lo echó.",
  a:{l:"Curarlo en silencio",fx:{don:8,alma:5},r:"Sana. Nadie sabrá nunca lo que hiciste."},
  b:{l:"Devolver el mal",fx:{don:15,alma:-12,temor:8},r:"A la semana, en el otro extremo del pueblo, doblan campanas."}},
 {t:"Sueñas con una puerta en mitad del monte. Al despertar tienes barro en los pies.",
  a:{l:"No volver a dormir ahí",fx:{alma:3},r:"Hay puertas que es mejor no abrir ni dormido."},
  b:{l:"Buscar la puerta despierto",fx:{don:18,alma:-8},r:"La encuentras. No estaba cerrada."}},
 {t:"Una niña del pueblo te trae un pájaro muerto. 'Me dijeron que tú los devuelves', dice.",
  a:{l:"Decirle que no se puede",fx:{alma:4},r:"Llora. Pero es verdad: hay cosas que no vuelven."},
  b:{l:"Soplarle el pico",fx:{don:20,temor:15,alma:-10},r:"El pájaro vuela. La niña corre. Mañana lo sabrá todo el pueblo."}},
];
const CARTA_AD={ad:true,t:"Un compadre te alcanza en el camino y te ofrece un trago de su cantimplora. 'Pa' que rinda el día', dice."};

function salirAlMonte(){
  if(S.muerto)return;
  S.edad++;
  /* 1 de cada 6 salidas: carta de "ad" */
  const esAd = Math.random()<0.16 && ultimaGanancia>2;
  const c = esAd?CARTA_AD:CARTAS[Math.floor(Math.random()*CARTAS.length)];
  abrirCarta(c);
}
function abrirCarta(c){
  const velo=document.getElementById('velo'),tx=document.getElementById('c-texto'),
        op=document.getElementById('opciones'),res=document.getElementById('resultado'),
        prob=document.getElementById('c-prob'),tipo=document.getElementById('c-tipo');
  res.style.display='none';prob.style.display='none';op.innerHTML='';
  tx.textContent=c.t;
  document.getElementById('c-edad').textContent=S.edad+" años";
  if(c.ad){
    tipo.textContent="EN EL CAMINO";
    boton(op,"→ Aceptar el trago","(aquí iría un anuncio con recompensa)",()=>{
      const g=Math.max(5,Math.floor(ultimaGanancia*2));S.don+=g;
      cerrarCon(`El trago quema bonito. +${g} de Don. [demo: esto sería un ad]`);
    });
    boton(op,"← Seguir tu camino","",()=>cerrarCon("Le agradeces y sigues."));
  }else if(c.apuesta){
    tipo.textContent="EN LA CANTINA";
    const monto=Math.min(S.plata,30);
    if(monto<5){boton(op,"→ Irte","No tienes plata que apostar",()=>cerrarCon("Sin plata no hay juego."));}
    else{
      boton(op,`→ Doble o nada (${monto})`,"55% de ganar",()=>{
        if(Math.random()<.55){S.plata+=monto;cerrarCon(`Ganas. +${monto} de plata. El del anillo deja de reír.`);}
        else{S.plata-=monto;S.temor+=3;cerrarCon(`Pierdes. Su risa te sigue hasta la puerta.`);}
      });
      boton(op,"← No jugar","",()=>cerrarCon("Hay noches para jugar y noches para irse."));
    }
  }else{
    tipo.textContent="EN EL MONTE";
    boton(op,"← "+c.a.l,"",()=>resolver(c.a));
    boton(op,"→ "+c.b.l,"",()=>resolver(c.b));
  }
  velo.classList.add('abierto');
}
function boton(cont,titulo,sub,fn){
  const b=document.createElement('button');
  b.innerHTML=`<span class="flecha">${titulo}</span>${sub?'<small style="font-style:italic;color:var(--hueso2)">'+sub+'</small>':''}`;
  b.onclick=fn;cont.appendChild(b);
}
function resolver(o){
  const fx=o.fx||{};
  if(fx.don)S.don=Math.max(0,S.don+fx.don);
  if(fx.temor)S.temor=Math.min(100,Math.max(0,S.temor+fx.temor));
  if(fx.alma)S.alma=Math.min(100,Math.max(0,S.alma+fx.alma));
  if(fx.plata)S.plata=Math.max(0,S.plata+fx.plata);
  if(fx.pacto){S.pactos+=fx.pacto;}
  cerrarCon(o.r||"Sigues tu camino.");
}
function cerrarCon(msj){
  const res=document.getElementById('resultado');
  document.getElementById('opciones').innerHTML='';
  res.textContent=msj;res.style.display='block';
  pintar();
  setTimeout(()=>{document.getElementById('velo').classList.remove('abierto');chequearMuerte();pintar();},1600);
}

/* ================= PRUEBA DE GRADO ================= */
function intentarGrado(){
  const g=GRADOS[S.grado+1];if(!g)return;
  const velo=document.getElementById('velo'),tx=document.getElementById('c-texto'),
        op=document.getElementById('opciones'),prob=document.getElementById('c-prob');
  document.getElementById('resultado').style.display='none';
  document.getElementById('c-tipo').textContent="LA PRUEBA · "+g.n.toUpperCase();
  document.getElementById('c-edad').textContent="";
  tx.textContent=g.prueba;
  prob.textContent=Math.round(g.prob*100)+"%";prob.style.display='block';
  op.innerHTML='';
  boton(op,"→ Intentarlo","Si fallas: pierdes Don y Alma",()=>{
    if(Math.random()<g.prob){
      S.grado++;S.pactos+=1;
      cerrarCon(`Amanece y sigues entero. Eres ${g.n}. Algo nuevo te acompaña desde hoy.`);
    }else{
      S.don=Math.floor(S.don*.6);S.alma=Math.max(0,S.alma-15);
      cerrarCon("Fallas. Vuelves al pueblo antes del alba, con menos de lo que llevabas.");
    }
  });
  boton(op,"← Todavía no","",()=>document.getElementById('velo').classList.remove('abierto'));
  velo.classList.add('abierto');
}

/* ================= MUERTE Y HERENCIA ================= */
function chequearMuerte(){
  if(S.muerto)return;
  let causa=null;
  if(S.alma<=0)causa={t:"Te quedaste sin alma",x:"Lo que quedaba de ti se fue con el último pacto. Tu cuerpo camina, pero ya no eres tú quien mira por esos ojos."};
  else if(S.temor>=100)causa={t:"El pueblo vino de noche",x:"Traían antorchas y traían miedo, que es peor. Nadie defendió tu puerta."};
  else if(S.edad>=58+S.grado*8)causa={t:"Te alcanzó la edad",x:"Ni el Don detiene todos los inviernos. Te apagas despacio, como vela que cumplió."};
  if(causa){
    S.muerto=true;
    const her=Math.floor(S.don*0.25)+S.grado*20;
    document.getElementById('m-titulo').textContent=causa.t;
    document.getElementById('m-texto').textContent=causa.x+" Pero dejaste enseñado a alguien. El Don no muere: cambia de manos.";
    document.getElementById('h-don').textContent=her+" de Don";
    S._herencia=her;
    document.getElementById('muerte').classList.add('abierto');
  }
}
function renacer(){
  const gen=S.gen+1,her=S._herencia||0,bonusToque=Math.floor((S.grado)/1)>0?S.grado:0;
  S=nuevoEstado(her,gen,bonusToque);
  document.getElementById('muerte').classList.remove('abierto');
  setPie("Otra vela. Otras manos. La misma llama.");
  pintar();
}

/* ================= RENDER ================= */
function ordinal(n){return ["Primera","Segunda","Tercera","Cuarta","Quinta","Sexta","Séptima","Octava","Novena","Décima"][n-1]||n+"ª";}
function pintarAcciones(){
  const cont=document.getElementById('acciones');cont.innerHTML='';
  if(S.monteAbierto){
    const b=document.createElement('button');b.className='acc';
    b.innerHTML='Salir al monte<small>una carta, una decisión, un año</small>';
    b.onclick=salirAlMonte;cont.appendChild(b);
  }
  const sig=GRADOS[S.grado+1];
  if(sig&&S.don>=sig.req){
    const b=document.createElement('button');b.className='acc dorado';
    b.innerHTML=`La prueba de ${sig.n}<small>estás listo para intentarlo</small>`;
    b.onclick=intentarGrado;cont.appendChild(b);
  }
}
function pintar(soloDon){
  document.getElementById('v-don').textContent=Math.floor(S.don);
  const sig=GRADOS[S.grado+1];
  document.getElementById('b-don').firstElementChild.style.width=(sig?Math.min(100,S.don/sig.req*100):100)+'%';
  if(!soloDon){
    document.getElementById('v-temor').textContent=S.temor;
    document.getElementById('v-alma').textContent=S.alma;
    document.getElementById('v-plata').textContent=S.plata;
    document.getElementById('b-temor').firstElementChild.style.width=S.temor+'%';
    document.getElementById('b-alma').firstElementChild.style.width=S.alma+'%';
    document.getElementById('b-plata').firstElementChild.style.width=Math.min(100,S.plata)+'%';
    document.getElementById('grado').textContent=GRADOS[S.grado].n+" · "+S.edad+" años";
    document.getElementById('gen').textContent=ordinal(S.gen)+" generación";
    document.getElementById('pactos-info').textContent=S.pactos>0?("+"+S.pactos+" Don/s · "+S.pactos+(S.pactos>1?" pactos":" pacto")):"";
  }
  pintarAcciones();
}
iniciar();
</script>

</html>
